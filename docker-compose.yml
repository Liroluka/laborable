services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: laborable
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d laborable"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/laborable
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      LABORABLE_ADMIN_API_KEY: ${LABORABLE_ADMIN_API_KEY:-}
      LABORABLE_CORS_ORIGINS: ${LABORABLE_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
